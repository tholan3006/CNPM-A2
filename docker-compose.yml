services:
  # 1. Database PostgreSQL có persistent volume
  postgres:
    image: postgres:16-alpine
    container_name: brewlite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend NestJS REST API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/brewlite?schema=public
      - PORT=4000
      - JWT_SECRET=brewlite_jwt_secret_key_sgu_2026_super_secure
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Next.js PWA
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: brewlite_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NODE_ENV=production
    depends_on:
      - api

volumes:
  postgres_data:
