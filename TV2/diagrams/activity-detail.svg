<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" width="1060" height="920" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="act-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="530" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Hoạt động (Activity Diagram) – Luồng Xem Món, Chọn Size, Topping &amp; Tính Giá Tự Động</text>
  <text x="530" y="48" text-anchor="middle" font-size="12" fill="#64748b">Quy trình tương tác qua 4 phân vùng trách nhiệm (Swimlanes): Customer, Frontend, Backend API &amp; Database</text>

  <!-- SWIMLANES -->
  <!-- Lane 1: Customer -->
  <rect x="20" y="70" width="245" height="830" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="20" y="70" width="245" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="142" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Khách hàng (Customer)</text>

  <!-- Lane 2: Frontend (Next.js Modal) -->
  <rect x="265" y="70" width="280" height="830" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="265" y="70" width="280" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="405" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Frontend (Next.js Modal)</text>

  <!-- Lane 3: Backend API (NestJS) -->
  <rect x="545" y="70" width="250" height="830" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="545" y="70" width="250" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="670" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Backend API (NestJS)</text>

  <!-- Lane 4: Database (PostgreSQL) -->
  <rect x="795" y="70" width="245" height="830" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="795" y="70" width="245" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="917" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Database (PostgreSQL)</text>

  <!-- STEP 1: START -->
  <circle cx="142" cy="130" r="10" fill="#1e293b"/>
  <line x1="142" y1="140" x2="142" y2="160" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Action: Click product -->
  <rect x="42" y="160" width="200" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="142" y="186" text-anchor="middle" font-size="11" fill="#0f172a">Nhấp chọn món trên Menu</text>

  <!-- Arrow to Frontend -->
  <line x1="242" y1="181" x2="300" y2="181" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Frontend: Show Skeleton & Call API -->
  <rect x="300" y="160" width="210" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="405" y="178" text-anchor="middle" font-size="11" fill="#0f172a">Mở Modal dạng Skeleton</text>
  <text x="405" y="193" text-anchor="middle" font-size="10" fill="#475569">Gửi GET /products/:id</text>

  <!-- Arrow to Backend -->
  <line x1="510" y1="181" x2="575" y2="181" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Backend: Validate ID & Query DB -->
  <rect x="575" y="160" width="190" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="670" y="178" text-anchor="middle" font-size="11" fill="#0f172a">Validate :id parameter</text>
  <text x="670" y="193" text-anchor="middle" font-size="10" fill="#475569">Gọi findOne(id) trong Service</text>

  <!-- Arrow to Database -->
  <line x1="765" y1="181" x2="825" y2="181" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Database: Query -->
  <rect x="825" y="160" width="185" height="46" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="917" y="178" text-anchor="middle" font-size="10" fill="#0f172a">SELECT product, sizes,</text>
  <text x="917" y="194" text-anchor="middle" font-size="10" fill="#0f172a">toppings WHERE id=:id</text>

  <!-- Down line in DB -->
  <line x1="917" y1="206" x2="917" y2="235" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Decision: Found? -->
  <polygon points="917,235 977,260 917,285 857,260" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="917" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Tìm thấy?</text>

  <!-- Branch: Yes -> Back to Backend -->
  <path d="M 857 260 L 760 260" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="815" y="252" font-size="10" fill="#16a34a">Có [200 OK]</text>

  <!-- Backend: Transform DTO -->
  <rect x="575" y="240" width="185" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="667" y="258" text-anchor="middle" font-size="11" fill="#0f172a">Transform DTO (Sizes, Toppings)</text>
  <text x="667" y="273" text-anchor="middle" font-size="10" fill="#475569">HTTP 200 OK JSON</text>

  <!-- Arrow to Frontend -->
  <line x1="575" y1="260" x2="510" y2="260" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Frontend: Render Modal & Defaults -->
  <rect x="295" y="235" width="215" height="52" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="402" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Khởi tạo State Mặc định:</text>
  <text x="402" y="268" text-anchor="middle" font-size="10" fill="#475569">Size M (+0đ), Toppings: [], Qty: 1</text>
  <text x="402" y="281" text-anchor="middle" font-size="10" fill="#475569">Tính Total = BasePrice</text>

  <!-- Arrow to Customer -->
  <line x1="295" y1="260" x2="242" y2="260" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Customer: View options -->
  <rect x="42" y="240" width="200" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="142" y="258" text-anchor="middle" font-size="11" fill="#0f172a">Xem chi tiết món &amp;</text>
  <text x="142" y="273" text-anchor="middle" font-size="11" fill="#0f172a">bảng danh sách tùy chọn</text>

  <!-- CUSTOMIZATION LOOP -->
  <line x1="142" y1="282" x2="142" y2="320" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Interactive Decision / Action in Customer lane -->
  <polygon points="142,320 222,350 142,380 62,350" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="142" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Thao tác</text>
  <text x="142" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Tùy biến?</text>

  <!-- Branch 1: Select Size -->
  <path d="M 222 340 L 300 340" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="245" y="333" font-size="9" fill="#1e293b">Đổi Size (S/M/L)</text>
  <rect x="300" y="325" width="210" height="32" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="405" y="345" text-anchor="middle" font-size="10" fill="#0f172a">Set Size: S (-5k), M (0k), L (+10k)</text>

  <!-- Branch 2: Select Topping -->
  <path d="M 222 355 L 260 355 L 260 390 L 300 390" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="225" y="380" font-size="9" fill="#1e293b">Tick Topping</text>
  <rect x="300" y="375" width="210" height="32" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="405" y="395" text-anchor="middle" font-size="10" fill="#0f172a">Thêm/bỏ ID Topping (+5k~12k)</text>

  <!-- Branch 3: Quantity +/- -->
  <path d="M 142 380 L 142 430 L 300 430" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="180" y="423" font-size="9" fill="#1e293b">Chỉnh Số lượng</text>
  <rect x="300" y="415" width="210" height="32" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="405" y="435" text-anchor="middle" font-size="10" fill="#0f172a">Cập nhật quantity (1 .. maxStock)</text>

  <!-- Merge lines to Dynamic Price Calculation in Frontend -->
  <path d="M 510 340 L 530 340 L 530 480 L 490 480" fill="none" stroke="#2563eb" stroke-width="1.3"/>
  <path d="M 510 390 L 530 390" fill="none" stroke="#2563eb" stroke-width="1.3"/>
  <path d="M 510 430 L 530 430" fill="none" stroke="#2563eb" stroke-width="1.3"/>

  <!-- Core Dynamic Calculation Box -->
  <rect x="290" y="465" width="230" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="405" y="485" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">TỰ ĐỘNG TÍNH GIÁ TIỀN (Real-time)</text>
  <text x="405" y="503" text-anchor="middle" font-size="10" fill="#1e40af">UnitPrice = Base + SizeExtra + Σ Toppings</text>
  <text x="405" y="519" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">TotalPrice = UnitPrice × Quantity</text>

  <!-- Feedback arrow to Customer button -->
  <line x1="290" y1="500" x2="220" y2="500" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#act-arrow)"/>
  <text x="255" y="493" text-anchor="middle" font-size="9" fill="#2563eb">Cập nhật UI</text>

  <!-- Customer inspects price -->
  <rect x="42" y="480" width="178" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="131" y="498" text-anchor="middle" font-size="11" fill="#0f172a">Thấy giá tiền cập nhật tức thời</text>
  <text x="131" y="513" text-anchor="middle" font-size="10" fill="#475569">trên nút "Thêm vào giỏ"</text>

  <!-- Line down: Decision to Add or Continue changing -->
  <line x1="131" y1="522" x2="131" y2="560" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <polygon points="131,560 196,585 131,610 66,585" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="131" y="588" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Thêm vào giỏ?</text>

  <!-- Loop back if continue modifying -->
  <path d="M 66 585 L 35 585 L 35 350 L 62 350" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#act-arrow)"/>
  <text x="25" y="460" font-size="9" fill="#64748b" transform="rotate(-90 25,460)">Đổi tùy chọn khác</text>

  <!-- Branch: Yes, Click Add to Cart -->
  <line x1="196" y1="585" x2="295" y2="585" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="235" y="578" font-size="10" fill="#16a34a">Bấm Thêm</text>

  <!-- Frontend: Add item to Zustand cart & LocalStorage -->
  <rect x="295" y="565" width="220" height="50" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="405" y="584" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Lưu vào Giỏ hàng (Cart State)</text>
  <text x="405" y="600" text-anchor="middle" font-size="10" fill="#475569">Item: { id, size, toppings, qty, total }</text>

  <!-- Arrow down in Frontend -->
  <line x1="405" y1="615" x2="405" y2="650" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Frontend: Toast & Close Modal -->
  <rect x="295" y="650" width="220" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="405" y="668" text-anchor="middle" font-size="11" fill="#0f172a">Bắn Toast thông báo thành công</text>
  <text x="405" y="683" text-anchor="middle" font-size="10" fill="#475569">Tự động đóng Modal chi tiết</text>

  <!-- Arrow back to Customer -->
  <line x1="295" y1="671" x2="230" y2="671" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Customer: Success & Stop -->
  <rect x="42" y="650" width="188" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="136" y="668" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Hoàn tất thêm món tùy chọn</text>
  <text x="136" y="683" text-anchor="middle" font-size="10" fill="#15803d">Badge giỏ hàng cập nhật số lượng</text>

  <line x1="136" y1="692" x2="136" y2="720" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  
  <!-- Outer Stop Circle -->
  <circle cx="136" cy="735" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="136" cy="735" r="9" fill="#1e293b"/>

  <!-- ERROR HANDLING BRANCH (Top right) -->
  <path d="M 977 260 L 1020 260 L 1020 780 L 760 780" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#act-arrow)"/>
  <text x="980" y="252" font-size="10" fill="#dc2626">Không [404]</text>

  <!-- Backend 404 handler -->
  <rect x="575" y="760" width="185" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="667" y="778" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Throw NotFoundException</text>
  <text x="667" y="792" text-anchor="middle" font-size="9" fill="#dc2626">HTTP 404: Product not found</text>

  <line x1="575" y1="780" x2="515" y2="780" stroke="#dc2626" stroke-width="1.2" marker-end="url(#act-arrow)"/>
  
  <!-- Frontend Alert & Stop -->
  <rect x="300" y="760" width="215" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="407" y="777" text-anchor="middle" font-size="10" fill="#991b1b">Toast: "Món không khả dụng"</text>
  <text x="407" y="791" text-anchor="middle" font-size="9" fill="#dc2626">Đóng Modal tự động</text>

  <line x1="300" y1="780" x2="230" y2="780" stroke="#dc2626" stroke-width="1.2" marker-end="url(#act-arrow)"/>
  <circle cx="215" cy="780" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="215" cy="780" r="7" fill="#dc2626"/>

  <!-- Note Footer -->
  <g transform="translate(40, 830)">
    <rect x="0" y="0" width="980" height="55" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="15" y="20" font-size="11" font-weight="bold" fill="#0f172a">Ghi chú Nghiệp vụ Tính toán (Business Calculation Rules):</text>
    <text x="15" y="36" font-size="10" fill="#475569">1. Giá tự động tính toán tức thời (Zero Latency Client calculation) mỗi khi người dùng đổi Size hoặc tick Topping.</text>
    <text x="15" y="49" font-size="10" fill="#475569">2. Topping hết hàng (stock = 0) bị disabled không cho tick chọn; Số lượng không được vượt quá số lượng tồn kho sản phẩm.</text>
  </g>
</svg>
