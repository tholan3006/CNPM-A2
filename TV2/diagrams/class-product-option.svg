<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="1020" height="720" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <polygon points="0,5 8,0 16,5 8,10" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <polygon points="0,5 8,0 16,5 8,10" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
    <marker id="class-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="510" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Lớp Lĩnh vực (Domain Class Diagram) – Lớp ProductOption, Size &amp; Topping</text>
  <text x="510" y="46" text-anchor="middle" font-size="12" fill="#64748b">Mô hình hóa thực thể, cấu trúc quan hệ 1..N, N..N, các thuộc tính, phương thức và DTOs chuyển đổi</text>

  <!-- ENUMS -->
  <!-- SizeCode Enum -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="150" height="110" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <rect x="0" y="0" width="150" height="26" fill="#f8fafc"/>
    <text x="75" y="12" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="75" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">SizeCode</text>
    <line x1="0" y1="26" x2="150" y2="26" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="46" font-size="11" fill="#0f172a">+ S (Small)</text>
    <text x="12" y="66" font-size="11" fill="#0f172a">+ M (Medium / Default)</text>
    <text x="12" y="86" font-size="11" fill="#0f172a">+ L (Large)</text>
  </g>

  <!-- SweetnessLevel & IceLevel Enums -->
  <g transform="translate(30, 210)">
    <rect x="0" y="0" width="150" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
    <rect x="0" y="0" width="150" height="26" fill="#f8fafc"/>
    <text x="75" y="12" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;enumeration&gt;&gt;</text>
    <text x="75" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">PortionLevels</text>
    <line x1="0" y1="26" x2="150" y2="26" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="46" font-size="10" font-weight="bold" fill="#1e293b">Đường (Sweetness):</text>
    <text x="12" y="62" font-size="10" fill="#0f172a">100%, 70%, 50%, 30%, 0%</text>
    <text x="12" y="86" font-size="10" font-weight="bold" fill="#1e293b">Đá (Ice Level):</text>
    <text x="12" y="102" font-size="10" fill="#0f172a">100%, 70%, 50%, 0%</text>
    <text x="12" y="118" font-size="10" fill="#0f172a">Đá riêng (Separate)</text>
  </g>

  <!-- CLASS 1: Product -->
  <g transform="translate(210, 80)">
    <rect x="0" y="0" width="260" height="270" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="30" fill="#f8fafc"/>
    <text x="130" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Product</text>
    <line x1="0" y1="30" x2="260" y2="30" stroke="#1e293b" stroke-width="1"/>
    
    <text x="10" y="48" font-size="10" fill="#0f172a">- id: UUID</text>
    <text x="10" y="64" font-size="10" fill="#0f172a">- categoryId: UUID</text>
    <text x="10" y="80" font-size="10" fill="#0f172a">- name: String</text>
    <text x="10" y="96" font-size="10" fill="#0f172a">- description: String</text>
    <text x="10" y="112" font-size="10" fill="#0f172a">- basePrice: Decimal</text>
    <text x="10" y="128" font-size="10" fill="#0f172a">- imageUrl: String</text>
    <text x="10" y="144" font-size="10" fill="#0f172a">- stock: Integer</text>
    <text x="10" y="160" font-size="10" fill="#0f172a">- isActive: Boolean</text>

    <line x1="0" y1="172" x2="260" y2="172" stroke="#1e293b" stroke-width="1"/>

    <text x="10" y="190" font-size="10" fill="#0f172a">+ getBasePrice(): Decimal</text>
    <text x="10" y="206" font-size="10" fill="#0f172a">+ getAvailableSizes(): List&lt;SizeOption&gt;</text>
    <text x="10" y="222" font-size="10" fill="#0f172a">+ getAvailableToppings(): List&lt;Topping&gt;</text>
    <text x="10" y="238" font-size="10" fill="#0f172a">+ calculateUnitPrice(size, toppings): Decimal</text>
    <text x="10" y="254" font-size="10" fill="#0f172a">+ calculateTotal(size, top, qty): Decimal</text>
  </g>

  <!-- CLASS 2: SizeOption -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="220" height="210" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" fill="#f8fafc"/>
    <text x="110" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">SizeOption</text>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#1e293b" stroke-width="1"/>

    <text x="10" y="48" font-size="10" fill="#0f172a">- id: UUID</text>
    <text x="10" y="64" font-size="10" fill="#0f172a">- productId: UUID</text>
    <text x="10" y="80" font-size="10" fill="#0f172a">- sizeCode: SizeCode</text>
    <text x="10" y="96" font-size="10" fill="#0f172a">- name: String</text>
    <text x="10" y="112" font-size="10" fill="#0f172a">- extraPrice: Decimal</text>
    <text x="10" y="128" font-size="10" fill="#0f172a">- isDefault: Boolean</text>
    <text x="10" y="144" font-size="10" fill="#0f172a">- isAvailable: Boolean</text>

    <line x1="0" y1="156" x2="220" y2="156" stroke="#1e293b" stroke-width="1"/>

    <text x="10" y="174" font-size="10" fill="#0f172a">+ getExtraPrice(): Decimal</text>
    <text x="10" y="190" font-size="10" fill="#0f172a">+ isAvailable(): Boolean</text>
  </g>

  <!-- CLASS 3: Topping -->
  <g transform="translate(780, 80)">
    <rect x="0" y="0" width="210" height="210" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="30" fill="#f8fafc"/>
    <text x="105" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Topping</text>
    <line x1="0" y1="30" x2="210" y2="30" stroke="#1e293b" stroke-width="1"/>

    <text x="10" y="48" font-size="10" fill="#0f172a">- id: UUID</text>
    <text x="10" y="64" font-size="10" fill="#0f172a">- name: String</text>
    <text x="10" y="80" font-size="10" fill="#0f172a">- price: Decimal</text>
    <text x="10" y="96" font-size="10" fill="#0f172a">- stock: Integer</text>
    <text x="10" y="112" font-size="10" fill="#0f172a">- isAvailable: Boolean</text>

    <line x1="0" y1="126" x2="210" y2="126" stroke="#1e293b" stroke-width="1"/>

    <text x="10" y="146" font-size="10" fill="#0f172a">+ getPrice(): Decimal</text>
    <text x="10" y="162" font-size="10" fill="#0f172a">+ getStock(): Integer</text>
    <text x="10" y="178" font-size="10" fill="#0f172a">+ isAvailable(): Boolean</text>
    <text x="10" y="194" font-size="10" fill="#0f172a">+ reduceStock(qty): Boolean</text>
  </g>

  <!-- CLASS 4: ProductTopping (Join Table / Entity) -->
  <g transform="translate(540, 320)">
    <rect x="0" y="0" width="180" height="85" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
    <rect x="0" y="0" width="180" height="24" fill="#f8fafc"/>
    <text x="90" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ProductTopping</text>
    <line x1="0" y1="24" x2="180" y2="24" stroke="#1e293b" stroke-width="1"/>
    <text x="8" y="42" font-size="10" fill="#0f172a">- productId: UUID</text>
    <text x="8" y="58" font-size="10" fill="#0f172a">- toppingId: UUID</text>
    <text x="8" y="74" font-size="10" fill="#0f172a">- isDefault: Boolean</text>
  </g>

  <!-- CLASS 5: ProductCustomization (Cart / Order Item Model) -->
  <g transform="translate(210, 420)">
    <rect x="0" y="0" width="280" height="260" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="0" y="0" width="280" height="30" fill="#dbeafe"/>
    <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">ProductCustomization</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#2563eb" stroke-width="1"/>

    <text x="10" y="48" font-size="10" fill="#1e293b">- product: Product</text>
    <text x="10" y="64" font-size="10" fill="#1e293b">- selectedSize: SizeOption</text>
    <text x="10" y="80" font-size="10" fill="#1e293b">- selectedToppings: List&lt;Topping&gt;</text>
    <text x="10" y="96" font-size="10" fill="#1e293b">- sweetness: SweetnessLevel</text>
    <text x="10" y="112" font-size="10" fill="#1e293b">- ice: IceLevel</text>
    <text x="10" y="128" font-size="10" fill="#1e293b">- quantity: Integer</text>
    <text x="10" y="144" font-size="10" fill="#1e293b">- unitPrice: Decimal</text>
    <text x="10" y="160" font-size="10" fill="#1e293b">- totalPrice: Decimal</text>

    <line x1="0" y1="172" x2="280" y2="172" stroke="#2563eb" stroke-width="1"/>

    <text x="10" y="190" font-size="10" font-weight="bold" fill="#1d4ed8">+ calculate(): Decimal</text>
    <text x="10" y="206" font-size="10" fill="#1e293b">+ changeSize(size: SizeOption): void</text>
    <text x="10" y="222" font-size="10" fill="#1e293b">+ toggleTopping(topping: Topping): void</text>
    <text x="10" y="238" font-size="10" fill="#1e293b">+ updateQuantity(qty: Integer): void</text>
    <text x="10" y="254" font-size="10" fill="#1e293b">+ toCartItemPayload(): Object</text>
  </g>

  <!-- DTOs (Data Transfer Objects) -->
  <!-- ProductDetailResponseDto -->
  <g transform="translate(540, 440)">
    <rect x="0" y="0" width="220" height="150" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
    <rect x="0" y="0" width="220" height="24" fill="#f8fafc"/>
    <text x="110" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ProductDetailResponseDto</text>
    <line x1="0" y1="24" x2="220" y2="24" stroke="#1e293b" stroke-width="1"/>
    <text x="8" y="42" font-size="10" fill="#0f172a">+ id: String</text>
    <text x="8" y="58" font-size="10" fill="#0f172a">+ name: String</text>
    <text x="8" y="74" font-size="10" fill="#0f172a">+ basePrice: Number</text>
    <text x="8" y="90" font-size="10" fill="#0f172a">+ imageUrl: String</text>
    <text x="8" y="106" font-size="10" fill="#0f172a">+ sizes: List&lt;SizeOptionDto&gt;</text>
    <text x="8" y="122" font-size="10" fill="#0f172a">+ toppings: List&lt;ToppingDto&gt;</text>
    <text x="8" y="138" font-size="10" fill="#0f172a">+ stock: Number</text>
  </g>

  <!-- PriceCalculationResultDto -->
  <g transform="translate(790, 440)">
    <rect x="0" y="0" width="200" height="165" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
    <rect x="0" y="0" width="200" height="24" fill="#f8fafc"/>
    <text x="100" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">PriceCalculationResultDto</text>
    <line x1="0" y1="24" x2="200" y2="24" stroke="#1e293b" stroke-width="1"/>
    <text x="8" y="42" font-size="10" fill="#0f172a">+ basePrice: Number</text>
    <text x="8" y="58" font-size="10" fill="#0f172a">+ sizeExtraPrice: Number</text>
    <text x="8" y="74" font-size="10" fill="#0f172a">+ toppingTotal: Number</text>
    <text x="8" y="90" font-size="10" fill="#0f172a">+ unitPrice: Number</text>
    <text x="8" y="106" font-size="10" fill="#0f172a">+ quantity: Number</text>
    <text x="8" y="122" font-size="10" fill="#0f172a">+ totalPrice: Number</text>
    <text x="8" y="142" font-size="9" fill="#15803d">+ formulaDescription: String</text>
  </g>

  <!-- RELATIONSHIPS -->
  <!-- Product *-- SizeOption (Composition 1 to 1..*) -->
  <line x1="470" y1="150" x2="520" y2="150" stroke="#1e293b" stroke-width="1.4" marker-start="url(#diamond-filled)"/>
  <text x="475" y="142" font-size="10" fill="#0f172a">1</text>
  <text x="500" y="142" font-size="10" fill="#0f172a">1..*</text>

  <!-- Product *-- ProductTopping -->
  <path d="M 440 350 L 440 365 L 540 365" fill="none" stroke="#1e293b" stroke-width="1.3" marker-start="url(#diamond-filled)"/>
  <text x="425" y="362" font-size="10" fill="#0f172a">1</text>
  <text x="520" y="360" font-size="10" fill="#0f172a">0..*</text>

  <!-- ProductTopping --> Topping -->
  <path d="M 720 365 L 850 365 L 850 290" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#class-arrow)"/>
  <text x="730" y="360" font-size="10" fill="#0f172a">*</text>
  <text x="835" y="305" font-size="10" fill="#0f172a">1</text>

  <!-- ProductCustomization -> Product -->
  <line x1="330" y1="420" x2="330" y2="350" stroke="#1e293b" stroke-width="1.3" marker-end="url(#class-arrow)"/>
  <text x="338" y="390" font-size="10" fill="#0f172a">customizes</text>

  <!-- ProductCustomization o-- Topping (Aggregation 0..*) -->
  <path d="M 490 540 L 890 540 L 890 290" fill="none" stroke="#1e293b" stroke-width="1.3" marker-start="url(#diamond)"/>
  <text x="505" y="532" font-size="10" fill="#0f172a">0..*</text>

  <!-- ProductCustomization --> SizeOption -->
  <path d="M 490 470 L 630 470 L 630 290" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#class-arrow)"/>
  <text x="500" y="462" font-size="10" fill="#0f172a">selects 1</text>

  <!-- Enums connection -->
  <line x1="180" y1="135" x2="520" y2="135" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="180" y1="285" x2="210" y2="470" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Footer note -->
  <g transform="translate(540, 625)">
    <rect x="0" y="0" width="450" height="55" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="18" font-size="10" font-weight="bold" fill="#0f172a">Mô hình Tính Giá (Pricing Calculation):</text>
    <text x="12" y="32" font-size="10" fill="#475569">ProductCustomization đóng gói trạng thái người dùng chọn và sinh ra</text>
    <text x="12" y="46" font-size="10" fill="#475569">PriceCalculationResultDto được truyền tiếp vào Giỏ hàng (Cart Item).</text>
  </g>
</svg>
