<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 900" width="1020" height="900" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="seq-arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <marker id="seq-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="510" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Tuần tự (Sequence Diagram) – Lấy Chi Tiết Sản Phẩm (GET /products/:id)</text>
  <text x="510" y="48" text-anchor="middle" font-size="12" fill="#64748b">Luồng giao tiếp HTTP, Prisma ORM, Xử lý ngoại lệ 404/500 và Tính giá Client-side</text>

  <!-- LIFELINES HEADERS -->
  <!-- 1. Customer -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="130" height="42" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="65" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Khách hàng</text>
    <text x="65" y="34" text-anchor="middle" font-size="10" fill="#475569">(Customer)</text>
    <line x1="65" y1="42" x2="65" y2="800" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- 2. Next.js UI -->
  <g transform="translate(230, 70)">
    <rect x="0" y="0" width="140" height="42" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ProductDetailModal</text>
    <text x="70" y="34" text-anchor="middle" font-size="10" fill="#475569">(Next.js Client)</text>
    <line x1="70" y1="42" x2="70" y2="800" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- 3. ProductsController -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="140" height="42" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ProductsController</text>
    <text x="70" y="34" text-anchor="middle" font-size="10" fill="#475569">(NestJS)</text>
    <line x1="70" y1="42" x2="70" y2="800" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- 4. ProductsService -->
  <g transform="translate(630, 70)">
    <rect x="0" y="0" width="140" height="42" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ProductsService</text>
    <text x="70" y="34" text-anchor="middle" font-size="10" fill="#475569">(NestJS)</text>
    <line x1="70" y1="42" x2="70" y2="800" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- 5. PostgreSQL DB -->
  <g transform="translate(830, 70)">
    <rect x="0" y="0" width="140" height="42" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Prisma / PostgreSQL</text>
    <text x="70" y="34" text-anchor="middle" font-size="10" fill="#475569">(Database)</text>
    <line x1="70" y1="42" x2="70" y2="800" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- ACTIVATION BARS -->
  <rect x="295" y="130" width="10" height="660" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="495" y="160" width="10" height="230" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="695" y="190" width="10" height="190" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <rect x="895" y="220" width="10" height="60" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>

  <!-- STEP 1: Click item -->
  <line x1="105" y1="140" x2="295" y2="140" stroke="#1e293b" stroke-width="1.3" marker-end="url(#seq-arrow)"/>
  <text x="120" y="134" font-size="10" font-weight="bold" fill="#0f172a">[01] Nhấp chọn món (productId = "prod-01")</text>

  <!-- STEP 2: Show Skeleton & Call API -->
  <path d="M 305 150 L 335 150 L 335 165 L 305 165" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="340" y="162" font-size="9" fill="#475569">openModal() &amp; Skeleton loading</text>

  <line x1="305" y1="180" x2="495" y2="180" stroke="#1e293b" stroke-width="1.3" marker-end="url(#seq-arrow)"/>
  <text x="320" y="174" font-size="10" font-weight="bold" fill="#0f172a">[02] HTTP GET /products/prod-01</text>

  <!-- STEP 3: Controller -> Service -->
  <line x1="505" y1="205" x2="695" y2="205" stroke="#1e293b" stroke-width="1.3" marker-end="url(#seq-arrow)"/>
  <text x="525" y="199" font-size="10" font-weight="bold" fill="#0f172a">[03] findOne("prod-01")</text>

  <!-- STEP 4: Service -> DB -->
  <line x1="705" y1="230" x2="895" y2="230" stroke="#1e293b" stroke-width="1.3" marker-end="url(#seq-arrow)"/>
  <text x="715" y="224" font-size="10" font-weight="bold" fill="#0f172a">[04] prisma.product.findUnique(include: sizes, toppings)</text>

  <!-- ALT FRAME: SUCCESS VS 404 NOT FOUND -->
  <rect x="250" y="270" width="700" height="210" rx="4" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="250" y="270" width="55" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="277" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">alt</text>
  <text x="315" y="283" font-size="10" font-weight="bold" fill="#15803d">[Trường hợp 1: Tìm thấy sản phẩm (200 OK)]</text>

  <!-- Step 5a: DB returns product -->
  <line x1="895" y1="300" x2="705" y2="300" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="720" y="294" font-size="9" fill="#0f172a">[05a] Record Product + sizes + productToppings</text>

  <!-- Step 6a: Service formats DTO -->
  <path d="M 705 310 L 735 310 L 735 325 L 705 325" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="740" y="322" font-size="9" fill="#475569">Format ProductDetailDto</text>

  <!-- Step 7a: Return to Controller -->
  <line x1="695" y1="340" x2="505" y2="340" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="535" y="334" font-size="9" fill="#0f172a">[06a] Return DTO</text>

  <!-- Step 8a: Controller to UI 200 OK -->
  <line x1="495" y1="365" x2="305" y2="365" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="330" y="358" font-size="10" font-weight="bold" fill="#16a34a">[07a] HTTP 200 OK { id, name, basePrice: 35000, sizes, toppings }</text>

  <!-- Step 9a: Render UI -->
  <line x1="295" y1="390" x2="105" y2="390" stroke="#16a34a" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
  <text x="120" y="384" font-size="10" fill="#16a34a">[08a] Hiển thị Modal với giá mặc định: 35.000đ</text>

  <!-- Alt Divider -->
  <line x1="250" y1="410" x2="950" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="425" font-size="10" font-weight="bold" fill="#dc2626">[Trường hợp 2: ID không tồn tại (404 Not Found)]</text>

  <!-- Step 5b: DB null & 404 -->
  <line x1="895" y1="440" x2="705" y2="440" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="760" y="434" font-size="9" fill="#dc2626">[05b] null</text>

  <line x1="695" y1="455" x2="505" y2="455" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="525" y="450" font-size="9" fill="#dc2626">NotFoundException</text>

  <line x1="495" y1="470" x2="305" y2="470" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#seq-arrow-dashed)"/>
  <text x="325" y="465" font-size="9" font-weight="bold" fill="#dc2626">HTTP 404 Not Found { "message": "Product not found" }</text>

  <!-- SECTION: DYNAMIC PRICE CALCULATION AT CLIENT -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="880" height="240" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="15" y="20" font-size="12" font-weight="bold" fill="#1d4ed8">Tương tác Chọn Tùy chọn &amp; Tính giá tự động tại Client (Client-side Dynamic Calculation)</text>

    <!-- User select Size L -->
    <line x1="45" y1="45" x2="235" y2="45" stroke="#1e293b" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
    <text x="55" y="39" font-size="10" fill="#0f172a">[09] Chọn Size L (Phụ thu: +10.000đ)</text>

    <path d="M 235 55 L 265 55 L 265 70 L 235 70" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="270" y="66" font-size="9" fill="#1d4ed8">calc: 35.000 + 10.000 = 45.000đ</text>

    <line x1="235" y1="85" x2="45" y2="85" stroke="#2563eb" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
    <text x="55" y="79" font-size="10" fill="#1d4ed8">[10] Cập nhật nhãn giá hiển thị: 45.000đ</text>

    <!-- User select Topping -->
    <line x1="45" y1="110" x2="235" y2="110" stroke="#1e293b" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
    <text x="55" y="104" font-size="10" fill="#0f172a">[11] Tick chọn Thạch cà phê (+6k) &amp; Kem phô mai (+10k)</text>

    <path d="M 235 120 L 265 120 L 265 135 L 235 135" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="270" y="131" font-size="9" fill="#1d4ed8">calc: (35k + 10k + 6k + 10k) × 1 = 61.000đ</text>

    <!-- User change Qty -->
    <line x1="45" y1="150" x2="235" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#seq-arrow)"/>
    <text x="55" y="144" font-size="10" fill="#0f172a">[12] Tăng số lượng lên 2 (+ button)</text>

    <path d="M 235 160 L 265 160 L 265 175 L 235 175" fill="none" stroke="#2563eb" stroke-width="1.2"/>
    <text x="270" y="171" font-size="9" fill="#1d4ed8">calc: 61.000đ × 2 = 122.000đ</text>

    <!-- User click Add to Cart -->
    <line x1="45" y1="195" x2="235" y2="195" stroke="#15803d" stroke-width="1.3" marker-end="url(#seq-arrow)"/>
    <text x="55" y="189" font-size="10" font-weight="bold" fill="#15803d">[13] Bấm "Thêm vào giỏ hàng • 122.000đ"</text>

    <path d="M 235 205 L 265 205 L 265 220 L 235 220" fill="none" stroke="#15803d" stroke-width="1.2"/>
    <text x="270" y="217" font-size="9" fill="#15803d">cartStore.addItem() &amp; Toast "Đã thêm thành công"</text>
  </g>

  <!-- Note Footer -->
  <g transform="translate(60, 755)">
    <rect x="0" y="0" width="880" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="15" y="18" font-size="10" font-weight="bold" fill="#0f172a">Đặc điểm Kiến trúc:</text>
    <text x="15" y="32" font-size="10" fill="#475569">API GET /products/:id trả về cấu trúc phân cấp (Nested DTO). Client cache thông tin món và tính toán giá tức thời không cần gọi lại API.</text>
  </g>
</svg>
