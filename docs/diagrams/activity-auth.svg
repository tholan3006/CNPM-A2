<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" width="1040" height="820" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="act-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="520" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Sơ đồ Hoạt động (Activity Diagram) – Luồng Nhập Thông tin, Xác thực Mật khẩu &amp; Lưu JWT Token</text>
  <text x="520" y="46" text-anchor="middle" font-size="11" fill="#64748b">Phân hệ Đăng nhập &amp; Đăng ký (Bcrypt Salt=10, HS256 JWT Token, Zustand Persist LocalStorage)</text>

  <!-- Swimlane Headers & Borders -->
  <rect x="20" y="62" width="1000" height="740" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="20" y="62" width="1000" height="32" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>

  <!-- Swimlane Vertical Dividers -->
  <line x1="250" y1="62" x2="250" y2="802" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="530" y1="62" x2="530" y2="802" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="810" y1="62" x2="810" y2="802" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Swimlane Titles -->
  <text x="135" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Người dùng (User)</text>
  <text x="390" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Frontend (Next.js AuthModal)</text>
  <text x="670" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Backend API (NestJS AuthService)</text>
  <text x="915" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Database (PostgreSQL)</text>

  <!-- Start Node -->
  <circle cx="135" cy="118" r="10" fill="#0f172a"/>
  <line x1="135" y1="128" x2="135" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#act-arrow)"/>

  <!-- Action 1: Open AuthModal -->
  <rect x="40" y="150" width="190" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="135" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Bấm "Đăng nhập / Đăng ký"</text>
  <text x="135" y="182" text-anchor="middle" font-size="9" fill="#475569">trên Navbar hoặc từ Giỏ hàng</text>

  <line x1="230" y1="171" x2="285" y2="171" stroke="#334155" stroke-width="1.5" marker-end="url(#act-arrow)"/>

  <!-- Action 2: Render Modal & Choose Mode -->
  <rect x="290" y="150" width="200" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="390" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Mở hộp thoại AuthModal</text>
  <text x="390" y="182" text-anchor="middle" font-size="9" fill="#475569">Chọn Tab: Đăng ký hoặc Đăng nhập</text>

  <line x1="290" y1="185" x2="135" y2="215" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Decision 1: Register or Login -->
  <polygon points="135,218 195,243 135,268 75,243" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="135" y="246" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Chế độ nào?</text>

  <!-- Branch A: Register -->
  <line x1="135" y1="268" x2="135" y2="295" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="168" y="285" font-size="9" font-weight="bold" fill="#0f172a">[Đăng ký]</text>

  <rect x="35" y="298" width="200" height="46" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="135" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Nhập Họ tên, SĐT (10 số),</text>
  <text x="135" y="331" text-anchor="middle" font-size="9" fill="#475569">Email &amp; Mật khẩu (&gt;= 6 ký tự)</text>

  <line x1="235" y1="321" x2="285" y2="321" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Validate 10-digit phone -->
  <polygon points="390,296 475,321 390,346 305,321" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="390" y="319" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">SĐT đủ 10 số</text>
  <text x="390" y="330" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">&amp; Email hợp lệ?</text>

  <!-- Phone Invalid -->
  <line x1="390" y1="346" x2="390" y2="372" stroke="#dc2626" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="415" y="362" font-size="9" fill="#dc2626">[Sai]</text>
  <rect x="295" y="375" width="190" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="390" y="395" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Báo lỗi đỏ dưới ô SĐT / Email</text>

  <!-- Phone Valid -> POST /auth/register -->
  <line x1="475" y1="321" x2="555" y2="321" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="512" y="314" text-anchor="middle" font-size="9" fill="#166534">[Hợp lệ]</text>

  <rect x="560" y="298" width="220" height="46" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="670" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">POST /auth/register</text>
  <text x="670" y="331" text-anchor="middle" font-size="9" fill="#475569">Chuẩn hóa email &amp; kiểm tra trùng</text>

  <line x1="780" y1="321" x2="830" y2="321" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- DB Check Unique Email -->
  <polygon points="915,296 995,321 915,346 835,321" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="915" y="319" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Email đã</text>
  <text x="915" y="330" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">tồn tại?</text>

  <!-- Duplicate Email -> 409 -->
  <line x1="915" y1="296" x2="915" y2="235" stroke="#dc2626" stroke-width="1.3"/>
  <line x1="915" y1="235" x2="770" y2="235" stroke="#dc2626" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="865" y="228" font-size="9" fill="#dc2626">[Đã tồn tại]</text>

  <rect x="570" y="215" width="198" height="38" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="669" y="232" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Trả lỗi 409 ConflictException</text>
  <text x="669" y="245" text-anchor="middle" font-size="9" fill="#991b1b">("Email is already registered")</text>

  <!-- Email New -> Hash Bcrypt & Insert -->
  <line x1="915" y1="346" x2="915" y2="395" stroke="#334155" stroke-width="1.4"/>
  <line x1="915" y1="395" x2="785" y2="395" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="865" y="388" font-size="9" fill="#166534">[Chưa có]</text>

  <rect x="555" y="372" width="228" height="46" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4"/>
  <text x="669" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Băm mật khẩu một chiều Bcrypt</text>
  <text x="669" y="405" text-anchor="middle" font-size="9" fill="#166534">bcrypt.hash(password, 10)</text>

  <line x1="783" y1="408" x2="835" y2="438" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <rect x="830" y="425" width="175" height="44" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="917" y="443" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">INSERT INTO users</text>
  <text x="917" y="457" text-anchor="middle" font-size="9" fill="#475569">(role: CUSTOMER, points: 0)</text>

  <!-- Branch B: Login -->
  <line x1="75" y1="243" x2="28" y2="243" stroke="#334155" stroke-width="1.4"/>
  <line x1="28" y1="243" x2="28" y2="480" stroke="#334155" stroke-width="1.4"/>
  <line x1="28" y1="480" x2="45" y2="480" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="58" y="468" font-size="9" font-weight="bold" fill="#0f172a">[Đăng nhập]</text>

  <rect x="48" y="460" width="180" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="138" y="478" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Nhập Email &amp; Mật khẩu</text>
  <text x="138" y="492" text-anchor="middle" font-size="9" fill="#475569">Bấm nút "Đăng nhập"</text>

  <line x1="228" y1="481" x2="295" y2="481" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <rect x="298" y="460" width="185" height="42" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="390" y="478" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Gửi POST /auth/login</text>
  <text x="390" y="492" text-anchor="middle" font-size="9" fill="#475569">{ email, password }</text>

  <line x1="483" y1="481" x2="555" y2="481" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Bcrypt Compare Decision -->
  <polygon points="670,452 785,481 670,510 555,481" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="670" y="478" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Tìm thấy User &amp;</text>
  <text x="670" y="490" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">bcrypt.compare()?</text>

  <!-- Invalid Login -> 401 -->
  <line x1="670" y1="510" x2="670" y2="538" stroke="#dc2626" stroke-width="1.3" marker-end="url(#act-arrow)"/>
  <text x="692" y="528" font-size="9" fill="#dc2626">[Sai]</text>
  <rect x="570" y="540" width="200" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="670" y="556" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Trả lỗi 401 Unauthorized</text>
  <text x="670" y="569" text-anchor="middle" font-size="9" fill="#991b1b">("Invalid email or password")</text>

  <!-- Merge to JWT Signing -->
  <line x1="917" y1="469" x2="917" y2="618" stroke="#334155" stroke-width="1.4"/>
  <line x1="917" y1="618" x2="790" y2="618" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <line x1="785" y1="481" x2="800" y2="481" stroke="#334155" stroke-width="1.4"/>
  <line x1="800" y1="481" x2="800" y2="605" stroke="#334155" stroke-width="1.4"/>
  <line x1="800" y1="605" x2="788" y2="605" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="822" y="502" font-size="9" fill="#166534">[Đúng]</text>

  <!-- Action: Sign JWT Token -->
  <rect x="550" y="592" width="235" height="52" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="667" y="611" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">Ký số JWT Access Token (HS256)</text>
  <text x="667" y="625" text-anchor="middle" font-size="9" fill="#1d4ed8">Payload: { sub, email, role } (exp: 7d)</text>
  <text x="667" y="638" text-anchor="middle" font-size="9" fill="#1e40af">Ẩn passwordHash khỏi JSON trả về</text>

  <line x1="550" y1="618" x2="495" y2="618" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Frontend Save JWT to Store -->
  <rect x="285" y="592" width="208" height="52" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
  <text x="389" y="611" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Lưu JWT vào Zustand Persist</text>
  <text x="389" y="625" text-anchor="middle" font-size="9" fill="#166534">setAuth(user, access_token)</text>
  <text x="389" y="638" text-anchor="middle" font-size="9" fill="#15803d">Cập nhật Navbar &amp; Loyalty Points</text>

  <line x1="389" y1="644" x2="389" y2="675" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>

  <!-- Role Check -->
  <polygon points="389,678 469,703 389,728 309,703" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/>
  <text x="389" y="706" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">role == BARISTA?</text>

  <!-- Barista Redirect -->
  <line x1="469" y1="703" x2="555" y2="703" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="510" y="696" text-anchor="middle" font-size="9" fill="#0f172a">[Có]</text>
  <rect x="558" y="683" width="215" height="40" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="665" y="701" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Chuyển hướng sang /orders</text>
  <text x="665" y="715" text-anchor="middle" font-size="9" fill="#475569">(Màn hình Điều phối Pha chế)</text>

  <!-- Customer Continue -->
  <line x1="309" y1="703" x2="230" y2="703" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <text x="270" y="696" text-anchor="middle" font-size="9" fill="#0f172a">[CUSTOMER]</text>
  <rect x="38" y="683" width="190" height="40" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="133" y="701" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Đóng AuthModal &amp; Mở khóa</text>
  <text x="133" y="715" text-anchor="middle" font-size="9" fill="#475569">Đặt hàng / Thanh toán (Bearer JWT)</text>

  <!-- Final Stop Node -->
  <line x1="133" y1="723" x2="133" y2="758" stroke="#334155" stroke-width="1.4" marker-end="url(#act-arrow)"/>
  <circle cx="133" cy="772" r="11" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="133" cy="772" r="6" fill="#0f172a"/>
</svg>
