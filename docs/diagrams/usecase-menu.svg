<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-open2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Use Case Chi tiết – Phân hệ "Xem Menu Đồ uống"</text>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#64748b">Chức năng lõi: Tải thực đơn, lọc phân loại danh mục, tìm kiếm và xem trạng thái</text>

  <!-- Boundary -->
  <rect x="220" y="75" width="660" height="515" rx="4" fill="#fafafa" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="220" y="75" width="310" height="28" fill="#334155"/>
  <text x="235" y="94" font-size="13" font-weight="bold" fill="#ffffff">Phân hệ Menu Sản phẩm (Product Menu)</text>

  <!-- Actor Customer -->
  <g transform="translate(60, 260)">
    <circle cx="40" cy="20" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="20" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="60" y2="115" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Khách hàng</text>
    <text x="40" y="153" text-anchor="middle" font-size="11" fill="#475569">(Customer)</text>
  </g>

  <!-- Central Use Case -->
  <ellipse cx="430" cy="300" rx="130" ry="32" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="430" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">UC-MENU-01: Xem Thực đơn</text>
  <text x="430" y="312" text-anchor="middle" font-size="11" fill="#475569">(Browse Product Menu)</text>

  <!-- Actor to Main UC -->
  <line x1="120" y1="310" x2="300" y2="300" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Sub Use Cases (Includes) -->
  <!-- UC-MENU-02: Lấy danh mục -->
  <ellipse cx="730" cy="150" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="730" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-MENU-02: Lấy danh mục</text>
  <text x="730" y="161" text-anchor="middle" font-size="10" fill="#475569">(Fetch Categories)</text>

  <!-- UC-MENU-05: Xem trạng thái tồn kho -->
  <ellipse cx="730" cy="230" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="730" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-MENU-05: Xem trạng thái</text>
  <text x="730" y="241" text-anchor="middle" font-size="10" fill="#475569">(Còn hàng / Hết hàng)</text>

  <!-- UC-MENU-06: Xem thông tin tóm tắt -->
  <ellipse cx="730" cy="310" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="730" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-MENU-06: Xem thẻ tóm tắt</text>
  <text x="730" y="321" text-anchor="middle" font-size="10" fill="#475569">(Ảnh, Tên, Đơn giá)</text>

  <!-- Sub Use Cases (Extends) -->
  <!-- UC-MENU-03: Lọc theo danh mục -->
  <ellipse cx="730" cy="395" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="730" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-MENU-03: Lọc theo danh mục</text>
  <text x="730" y="406" text-anchor="middle" font-size="10" fill="#475569">(Filter by Category Tab)</text>

  <!-- UC-MENU-04: Tìm kiếm đồ uống -->
  <ellipse cx="730" cy="475" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="730" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-MENU-04: Tìm kiếm đồ uống</text>
  <text x="730" y="486" text-anchor="middle" font-size="10" fill="#475569">(Search Drinks by Keyword)</text>

  <!-- UC-DETAIL-01: Chuyển tiếp Xem chi tiết -->
  <ellipse cx="430" cy="510" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="430" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-DETAIL-01: Chi tiết &amp; Tùy chọn</text>
  <text x="430" y="521" text-anchor="middle" font-size="10" fill="#475569">(Mở Modal Size &amp; Topping)</text>

  <!-- Include Arrows (Main -> Sub) -->
  <line x1="510" y1="275" x2="630" y2="175" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="560" y="215" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="540" y1="285" x2="620" y2="245" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="565" y="258" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="560" y1="300" x2="615" y2="305" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="565" y="320" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend Arrows (Sub -> Main) -->
  <line x1="620" y1="380" x2="520" y2="330" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="575" y="365" font-size="10" fill="#475569">&lt;&lt;extend&gt;&gt;</text>

  <line x1="630" y1="455" x2="495" y2="335" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="570" y="420" font-size="10" fill="#475569">&lt;&lt;extend&gt;&gt;</text>

  <line x1="430" y1="484" x2="430" y2="332" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open2)"/>
  <text x="440" y="425" font-size="10" fill="#475569">&lt;&lt;extend&gt;&gt;</text>
</svg>
