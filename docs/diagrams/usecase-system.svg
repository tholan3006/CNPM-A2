<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Use Case Tổng quan Hệ thống BrewLite (System Overview)</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">Môn: Công nghệ Phần mềm | Đồ án: BrewLite (Assignment 2)</text>

  <!-- System Boundary -->
  <rect x="220" y="70" width="560" height="660" rx="4" fill="#fafafa" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="220" y="70" width="280" height="28" fill="#334155"/>
  <text x="235" y="89" font-size="13" font-weight="bold" fill="#ffffff">Hệ thống BrewLite (BrewLite System)</text>

  <!-- Actor 1: Customer (Left) -->
  <g transform="translate(60, 260)">
    <circle cx="40" cy="20" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="20" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="60" y2="115" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Khách hàng</text>
    <text x="40" y="153" text-anchor="middle" font-size="11" fill="#475569">&lt;&lt;Primary Actor&gt;&gt;</text>
  </g>

  <!-- Actor 2: Barista (Right Top) -->
  <g transform="translate(860, 140)">
    <circle cx="40" cy="20" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="20" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="60" y2="115" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Nhân viên Quầy</text>
    <text x="40" y="153" text-anchor="middle" font-size="11" fill="#475569">(Barista)</text>
  </g>

  <!-- Actor 3: Payment Gateway (Right Middle) -->
  <g transform="translate(855, 390)">
    <rect x="5" y="15" width="80" height="50" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <text x="45" y="36" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">&lt;&lt;system&gt;&gt;</text>
    <text x="45" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Payment GW</text>
    <text x="45" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Cổng thanh toán</text>
    <text x="45" y="101" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;External System&gt;&gt;</text>
  </g>

  <!-- Actor 4: Manager (Right Bottom) -->
  <g transform="translate(860, 560)">
    <circle cx="40" cy="20" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="40" y1="36" x2="40" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="15" y1="50" x2="65" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="20" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="75" x2="60" y2="115" stroke="#1e293b" stroke-width="2"/>
    <text x="40" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Quản lý (PO)</text>
    <text x="40" y="153" text-anchor="middle" font-size="11" fill="#475569">(Store Manager)</text>
  </g>

  <!-- USE CASES (Clean White Ellipses with Dark Slate Outline) -->
  <!-- UC01: Xem menu -->
  <ellipse cx="370" cy="140" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="370" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC01: Xem thực đơn đồ uống</text>
  <text x="370" y="151" text-anchor="middle" font-size="10" fill="#475569">(Browse Menu)</text>

  <!-- UC02: Tìm kiếm / Lọc -->
  <ellipse cx="640" cy="140" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="640" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC02: Lọc &amp; Tìm kiếm món</text>
  <text x="640" y="151" text-anchor="middle" font-size="10" fill="#475569">(Search &amp; Filter)</text>

  <!-- UC03: Chi tiết món -->
  <ellipse cx="370" cy="215" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="370" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC03: Xem chi tiết món</text>
  <text x="370" y="226" text-anchor="middle" font-size="10" fill="#475569">(Size, Topping, Giá)</text>

  <!-- UC06: Xác thực -->
  <ellipse cx="640" cy="215" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="640" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC06: Đăng ký / Đăng nhập</text>
  <text x="640" y="226" text-anchor="middle" font-size="10" fill="#475569">(JWT Authentication)</text>

  <!-- UC04: Giỏ hàng -->
  <ellipse cx="370" cy="295" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="370" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC04: Quản lý giỏ hàng</text>
  <text x="370" y="306" text-anchor="middle" font-size="10" fill="#475569">(Thêm/Sửa/Xóa)</text>

  <!-- UC05: Tạo đơn -->
  <ellipse cx="640" cy="295" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="640" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC05: Khởi tạo đơn hàng</text>
  <text x="640" y="306" text-anchor="middle" font-size="10" fill="#475569">(Create Order)</text>

  <!-- UC07: Thanh toán -->
  <ellipse cx="505" cy="385" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="505" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC07: Thanh toán điện tử</text>
  <text x="505" y="396" text-anchor="middle" font-size="10" fill="#475569">(Cashless Payment)</text>

  <!-- UC08: Xác nhận đơn -->
  <ellipse cx="370" cy="475" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="370" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC08: Xem mã đơn &amp; Biên lai</text>
  <text x="370" y="486" text-anchor="middle" font-size="10" fill="#475569">(Order Receipt)</text>

  <!-- UC09: Lịch sử đơn -->
  <ellipse cx="640" cy="475" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="640" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC09: Tra cứu lịch sử đơn</text>
  <text x="640" y="486" text-anchor="middle" font-size="10" fill="#475569">(Order History)</text>

  <!-- UC10: Barista -->
  <ellipse cx="640" cy="565" rx="115" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="640" y="561" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC10: Tiếp nhận pha chế</text>
  <text x="640" y="576" text-anchor="middle" font-size="10" fill="#475569">(Update Preparation State)</text>

  <!-- UC11: Manager -->
  <ellipse cx="370" cy="650" rx="120" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="370" y="646" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC11: Quản lý danh mục &amp; kho</text>
  <text x="370" y="661" text-anchor="middle" font-size="10" fill="#475569">(Menu &amp; Inventory)</text>

  <!-- LINES: Customer Associations -->
  <line x1="120" y1="310" x2="252" y2="145" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="315" x2="252" y2="218" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="320" x2="250" y2="295" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="325" x2="385" y2="385" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="330" x2="255" y2="475" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="335" x2="528" y2="480" stroke="#334155" stroke-width="1.2"/>

  <!-- Secondary Actors Associations -->
  <line x1="860" y1="210" x2="755" y2="560" stroke="#334155" stroke-width="1.2"/>
  <line x1="855" y1="415" x2="625" y2="390" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="730" y="395" font-size="10" fill="#475569">&lt;&lt;integrate&gt;&gt;</text>
  <line x1="860" y1="620" x2="490" y2="650" stroke="#334155" stroke-width="1.2"/>

  <!-- Include / Extend Dashed Lines -->
  <!-- UC02 extend UC01 -->
  <line x1="525" y1="140" x2="490" y2="140" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="507" y="132" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC03 extend UC01 -->
  <line x1="370" y1="189" x2="370" y2="166" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="395" y="180" font-size="9" fill="#475569">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC05 include UC04 -->
  <line x1="525" y1="295" x2="490" y2="295" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="507" y="287" text-anchor="middle" font-size="9" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <!-- UC07 include UC05 -->
  <line x1="550" y1="360" x2="600" y2="320" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="600" y="350" font-size="9" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <!-- UC07 include UC08 -->
  <line x1="465" y1="410" x2="410" y2="450" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="445" y="445" font-size="9" fill="#475569">&lt;&lt;include&gt;&gt;</text>
</svg>
