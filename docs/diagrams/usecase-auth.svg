<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Sơ đồ Use Case Chi tiết – Phân hệ "Đăng nhập, Đăng ký &amp; Quản lý Tài khoản (JWT)"</text>
  <text x="490" y="48" text-anchor="middle" font-size="12" fill="#64748b">Chức năng lõi: Đăng ký, băm mật khẩu Bcrypt, đăng nhập, cấp phát JWT Access Token và bảo vệ Route</text>

  <!-- System Boundary -->
  <rect x="230" y="70" width="710" height="550" rx="6" fill="#fafafa" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="230" y="70" width="380" height="28" fill="#334155"/>
  <text x="245" y="89" font-size="13" font-weight="bold" fill="#ffffff">Phân hệ Xác thực &amp; Phân quyền (Auth &amp; JWT Subsystem)</text>

  <!-- Actor 1: Guest User -->
  <g transform="translate(55, 150)">
    <circle cx="45" cy="20" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="45" y1="36" x2="45" y2="75" stroke="#1e293b" stroke-width="2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#1e293b" stroke-width="2"/>
    <line x1="45" y1="75" x2="25" y2="115" stroke="#1e293b" stroke-width="2"/>
    <line x1="45" y1="75" x2="65" y2="115" stroke="#1e293b" stroke-width="2"/>
    <text x="45" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Khách vãng lai</text>
    <text x="45" y="151" text-anchor="middle" font-size="11" fill="#475569">(Guest User)</text>
  </g>

  <!-- Actor 2: Authenticated User -->
  <g transform="translate(55, 395)">
    <circle cx="45" cy="20" r="16" fill="#f0fdf4" stroke="#166534" stroke-width="1.8"/>
    <line x1="45" y1="36" x2="45" y2="75" stroke="#166534" stroke-width="2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#166534" stroke-width="2"/>
    <line x1="45" y1="75" x2="25" y2="115" stroke="#166534" stroke-width="2"/>
    <line x1="45" y1="75" x2="65" y2="115" stroke="#166534" stroke-width="2"/>
    <text x="45" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Người dùng Đã xác thực</text>
    <text x="45" y="151" text-anchor="middle" font-size="10" fill="#475569">(Customer / Barista / Admin)</text>
  </g>

  <!-- Primary Use Cases (Left Column inside Boundary) -->
  <!-- UC-AUTH-01: Register -->
  <ellipse cx="420" cy="165" rx="130" ry="30" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="420" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">UC-AUTH-01: Đăng ký tài khoản</text>
  <text x="420" y="177" text-anchor="middle" font-size="10" fill="#475569">(POST /auth/register)</text>

  <!-- UC-AUTH-04: Login -->
  <ellipse cx="420" cy="275" rx="130" ry="30" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="420" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">UC-AUTH-04: Đăng nhập hệ thống</text>
  <text x="420" y="287" text-anchor="middle" font-size="10" fill="#475569">(POST /auth/login)</text>

  <!-- UC-AUTH-07: Profile -->
  <ellipse cx="420" cy="395" rx="130" ry="28" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="420" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-07: Xem hồ sơ &amp; Điểm</text>
  <text x="420" y="406" text-anchor="middle" font-size="10" fill="#475569">(GET /auth/me - Loyalty Points)</text>

  <!-- UC-AUTH-08: Guard Routes -->
  <ellipse cx="420" cy="485" rx="135" ry="28" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="420" y="481" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-08: Bảo vệ Route Đặt đơn</text>
  <text x="420" y="496" text-anchor="middle" font-size="10" fill="#475569">(JwtAuthGuard &amp; RolesGuard)</text>

  <!-- UC-AUTH-09: Logout -->
  <ellipse cx="420" cy="570" rx="130" ry="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="420" y="566" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-09: Đăng xuất tài khoản</text>
  <text x="420" y="581" text-anchor="middle" font-size="10" fill="#475569">(Xóa JWT khỏi LocalStorage)</text>

  <!-- Included Sub Use Cases (Right Column inside Boundary) -->
  <!-- UC-AUTH-02: Validate Input -->
  <ellipse cx="785" cy="125" rx="125" ry="26" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="785" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-02: Kiểm tra SĐT &amp; Email</text>
  <text x="785" y="136" text-anchor="middle" font-size="10" fill="#475569">(10 chữ số &amp; @unique email)</text>

  <!-- UC-AUTH-03: Bcrypt Hash -->
  <ellipse cx="785" cy="200" rx="125" ry="26" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="785" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-03: Băm mật khẩu Bcrypt</text>
  <text x="785" y="211" text-anchor="middle" font-size="10" fill="#475569">(bcrypt.hash, Salt Rounds = 10)</text>

  <!-- UC-AUTH-05: Bcrypt Compare -->
  <ellipse cx="785" cy="280" rx="125" ry="26" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="785" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-05: Đối chiếu mật khẩu</text>
  <text x="785" y="291" text-anchor="middle" font-size="10" fill="#475569">(bcrypt.compare chống Timing Attack)</text>

  <!-- UC-AUTH-06: Issue JWT -->
  <ellipse cx="785" cy="365" rx="125" ry="28" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
  <text x="785" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">UC-AUTH-06: Cấp phát &amp; Lưu JWT</text>
  <text x="785" y="376" text-anchor="middle" font-size="10" fill="#475569">(Ký HS256: sub, email, role - 7d)</text>

  <!-- Security Note Box -->
  <rect x="650" y="435" width="265" height="155" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="665" y="457" font-size="11" font-weight="bold" fill="#92400e">Ràng buộc Bảo mật (NFR-SEC):</text>
  <text x="665" y="477" font-size="10" fill="#78350f">• Không lưu plaintext password trong DB</text>
  <text x="665" y="495" font-size="10" fill="#78350f">• Loại bỏ passwordHash khỏi JSON trả về</text>
  <text x="665" y="513" font-size="10" fill="#78350f">• Ký JWT bằng biến môi trường JWT_SECRET</text>
  <text x="665" y="531" font-size="10" fill="#78350f">• Chặn POST /orders &amp; /payments nếu thiếu</text>
  <text x="673" y="546" font-size="10" fill="#78350f">hoặc hết hạn Bearer Token (401)</text>
  <text x="665" y="566" font-size="10" fill="#78350f">• Tự chuyển /orders nếu role = BARISTA</text>

  <!-- Actor Associations -->
  <line x1="135" y1="205" x2="290" y2="168" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="135" y1="220" x2="290" y2="270" stroke="#1e293b" stroke-width="1.5"/>

  <line x1="145" y1="445" x2="290" y2="398" stroke="#166534" stroke-width="1.5"/>
  <line x1="145" y1="460" x2="285" y2="485" stroke="#166534" stroke-width="1.5"/>
  <line x1="145" y1="478" x2="290" y2="565" stroke="#166534" stroke-width="1.5"/>

  <!-- Include Relations -->
  <line x1="545" y1="155" x2="660" y2="132" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="602" y="137" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="548" y1="172" x2="660" y2="195" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="605" y="179" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="515" y1="186" x2="685" y2="345" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="625" y="252" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="550" y1="276" x2="660" y2="279" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="605" y="272" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <line x1="535" y1="290" x2="668" y2="352" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="595" y="335" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend Relation (Guard -> Login) -->
  <line x1="420" y1="457" x2="420" y2="305" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-open)"/>
  <text x="458" y="350" text-anchor="middle" font-size="10" fill="#475569">&lt;&lt;extend&gt;&gt;</text>
</svg>
