<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 840" width="1040" height="840" style="background:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="seq-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="seq-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="520" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Sơ đồ Tuần tự (Sequence Diagram) – Xác thực Tài khoản (POST /auth/register, POST /auth/login)</text>
  <text x="520" y="46" text-anchor="middle" font-size="11" fill="#64748b">Luồng Đăng ký, Băm mật khẩu Bcrypt (Salt=10), Đăng nhập, Ký số JWT (HS256) và JwtAuthGuard bảo vệ Route</text>

  <!-- Lifeline Headers -->
  <!-- 1. User -->
  <rect x="35" y="65" width="130" height="44" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="100" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Người dùng</text>
  <text x="100" y="100" text-anchor="middle" font-size="10" fill="#475569">(User / Actor)</text>

  <!-- 2. Next.js UI -->
  <rect x="235" y="65" width="160" height="44" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="315" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Next.js UI</text>
  <text x="315" y="100" text-anchor="middle" font-size="10" fill="#475569">(AuthModal &amp; cartStore)</text>

  <!-- 3. AuthController / Guard -->
  <rect x="465" y="65" width="160" height="44" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="545" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">AuthController</text>
  <text x="545" y="100" text-anchor="middle" font-size="10" fill="#475569">(ValidationPipe &amp; Guard)</text>

  <!-- 4. AuthService / JwtService -->
  <rect x="690" y="65" width="160" height="44" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="770" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">AuthService</text>
  <text x="770" y="100" text-anchor="middle" font-size="10" fill="#475569">(Bcrypt &amp; JwtService)</text>

  <!-- 5. PostgreSQL DB -->
  <rect x="895" y="65" width="120" height="44" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
  <text x="955" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">PostgreSQL</text>
  <text x="955" y="100" text-anchor="middle" font-size="10" fill="#166534">(Prisma ORM)</text>

  <!-- Lifelines -->
  <line x1="100" y1="109" x2="100" y2="805" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="315" y1="109" x2="315" y2="805" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="545" y1="109" x2="545" y2="805" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="770" y1="109" x2="770" y2="805" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="955" y1="109" x2="955" y2="805" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Section Divider 1: Register -->
  <rect x="30" y="122" width="985" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">== Luồng 1: Đăng ký Tài khoản Mới (POST /auth/register) ==</text>

  <!-- Message 01 -->
  <line x1="100" y1="165" x2="310" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="205" y="159" text-anchor="middle" font-size="10" fill="#0f172a">[01] Nhập Họ tên, SĐT (10 số), Email, Mật khẩu</text>

  <!-- Message 02 -->
  <line x1="315" y1="192" x2="540" y2="192" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="428" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">[02] POST /auth/register { email, password, fullName, phone }</text>

  <!-- Message 03 -->
  <line x1="545" y1="218" x2="765" y2="218" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="655" y="212" text-anchor="middle" font-size="10" fill="#0f172a">[03] register(dto) (đã validate DTO)</text>

  <!-- Message 04 -->
  <line x1="770" y1="244" x2="950" y2="244" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="862" y="238" text-anchor="middle" font-size="10" fill="#0f172a">[04] user.findUnique({ email })</text>

  <!-- Alt Box for Register -->
  <rect x="250" y="260" width="755" height="190" fill="none" stroke="#475569" stroke-width="1.2"/>
  <rect x="250" y="260" width="55" height="18" fill="#475569"/>
  <text x="277" y="273" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">alt</text>
  <text x="420" y="274" font-size="10" font-weight="bold" fill="#991b1b">[Email đã tồn tại trong CSDL (Duplicate Email)]</text>

  <!-- Message 05a -->
  <line x1="955" y1="292" x2="775" y2="292" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="865" y="286" text-anchor="middle" font-size="10" fill="#991b1b">[05a] existingUser != null</text>

  <!-- Message 06a -->
  <line x1="770" y1="312" x2="320" y2="312" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="545" y="306" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">[06a] HTTP 409 Conflict ("Email is already registered")</text>

  <!-- Alt Divider -->
  <line x1="250" y1="326" x2="1005" y2="326" stroke="#475569" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="415" y="341" font-size="10" font-weight="bold" fill="#166534">[Email hợp lệ – Tạo tài khoản mới]</text>

  <!-- Message 05b: Bcrypt Hash & Create -->
  <line x1="770" y1="364" x2="950" y2="364" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="860" y="358" text-anchor="middle" font-size="10" fill="#14532d">[05b] bcrypt.hash(pwd, 10) -&gt; user.create()</text>

  <line x1="955" y1="390" x2="775" y2="390" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="865" y="384" text-anchor="middle" font-size="10" fill="#475569">[06b] User(id, role=CUSTOMER, points=0)</text>

  <!-- Message 07b: Sign JWT & Return 201 -->
  <line x1="770" y1="418" x2="320" y2="418" stroke="#166534" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="545" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">[07b] jwtService.signAsync() -&gt; HTTP 201 Created { access_token, user }</text>

  <line x1="315" y1="440" x2="105" y2="440" stroke="#166534" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="210" y="434" text-anchor="middle" font-size="10" fill="#14532d">[08] setAuth(user, token) &amp; Đóng Modal</text>

  <!-- Section Divider 2: Login -->
  <rect x="30" y="465" width="985" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">== Luồng 2: Đăng nhập Tài khoản (POST /auth/login) ==</text>

  <!-- Message 09 -->
  <line x1="100" y1="508" x2="310" y2="508" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="205" y="502" text-anchor="middle" font-size="10" fill="#0f172a">[09] Nhập Email, Mật khẩu &amp; bấm "Đăng nhập"</text>

  <!-- Message 10 -->
  <line x1="315" y1="532" x2="540" y2="532" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="428" y="526" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">[10] POST /auth/login { email, password }</text>

  <!-- Message 11 -->
  <line x1="545" y1="556" x2="765" y2="556" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="655" y="550" text-anchor="middle" font-size="10" fill="#0f172a">[11] login(dto)</text>

  <!-- Message 12 -->
  <line x1="770" y1="580" x2="950" y2="580" stroke="#1e293b" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="860" y="574" text-anchor="middle" font-size="10" fill="#0f172a">[12] user.findUnique({ email })</text>

  <line x1="955" y1="604" x2="775" y2="604" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="865" y="598" text-anchor="middle" font-size="10" fill="#475569">[13] User record (kèm passwordHash)</text>

  <!-- Alt Box for Login -->
  <rect x="250" y="618" width="600" height="95" fill="none" stroke="#475569" stroke-width="1.2"/>
  <rect x="250" y="618" width="55" height="18" fill="#475569"/>
  <text x="277" y="631" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">alt</text>
  <text x="445" y="632" font-size="10" font-weight="bold" fill="#991b1b">[bcrypt.compare(password, passwordHash) == false]</text>

  <line x1="770" y1="652" x2="320" y2="652" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="545" y="646" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">[14a] HTTP 401 Unauthorized ("Invalid email or password")</text>

  <line x1="250" y1="664" x2="850" y2="664" stroke="#475569" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="435" y="678" font-size="10" font-weight="bold" fill="#166534">[bcrypt.compare() == true – Mật khẩu chính xác]</text>

  <line x1="770" y1="700" x2="320" y2="700" stroke="#166534" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#seq-open)"/>
  <text x="545" y="694" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">[14b] HTTP 200 OK { access_token, user } -&gt; setAuth(user, token)</text>

  <!-- Section Divider 3: Guard -->
  <rect x="30" y="726" width="985" height="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="520" y="741" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">== Luồng 3: JwtAuthGuard &amp; JwtStrategy Bảo vệ Route Đặt đơn (POST /orders) ==</text>

  <line x1="315" y1="768" x2="540" y2="768" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="428" y="762" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">[15] POST /orders [Header: Authorization: Bearer &lt;access_token&gt;]</text>

  <line x1="545" y1="792" x2="950" y2="792" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#seq-solid)"/>
  <text x="748" y="786" text-anchor="middle" font-size="10" fill="#1e3a8a">[16] JwtStrategy.validate(payload) -&gt; Verify chữ ký HS256 &amp; gắn req.user</text>
</svg>
