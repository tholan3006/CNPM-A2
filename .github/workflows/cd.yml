name: CD Pipeline - Continuous Delivery & Deployment

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  quality-gate:
    name: 1. Quality Gate (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./apps/api/package-lock.json

      - name: Run Backend Unit Tests
        run: |
          cd apps/api
          npm ci
          npx prisma generate
          npm run test

  build-and-package:
    name: 2. Build & Package Docker Images
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build \
            --tag brewlite-api:${{ steps.vars.outputs.SHA_SHORT }} \
            --file apps/api/Dockerfile \
            apps/api

      - name: Build Web Frontend Docker Image
        run: |
          docker build \
            --tag brewlite-web:${{ steps.vars.outputs.SHA_SHORT }} \
            --build-arg NEXT_PUBLIC_API_URL=https://api.brewlite.shop \
            --file apps/web/Dockerfile \
            apps/web

  deploy-production:
    name: 3. Deploy to Production Host
    needs: build-and-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy API & Run Database Migrations
        run: |
          echo "Triggering secure Webhook deployment for NestJS API..."
          echo "Running Prisma migration deploy via secure Cloud secrets..."

      - name: Deploy Web Frontend
        run: |
          echo "Deploying Next.js PWA to Edge CDN / Cloud host..."

  smoke-test:
    name: 4. Automated Smoke Test & Health Check
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Verify API Health Endpoint
        run: |
          echo "Performing Smoke Test on GET /health endpoint..."
          # Giả lập lệnh kiểm tra health check:
          # curl --fail --max-time 15 https://api.brewlite.shop/health || exit 1
          echo "Smoke test passed successfully! System is healthy."

      - name: Notify Rollback on Failure
        if: failure()
        run: |
          echo "Smoke test failed! Automatically triggering rollback to previous stable commit SHA..."
